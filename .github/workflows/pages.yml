
name: Deploy regression dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify dashboard
        run: |
          test -s dashboard/index.html
          test -s dashboard/app.js
          test -s dashboard/styles.css
          test -s dashboard/vendor/chart.umd.min.js
          test -s dashboard/dataset-input.js
          test -s dashboard/dataset-panel.js
          test -s dashboard/data/BostonHousing.csv
          python -m json.tool dashboard/data/models.json > /dev/null
          python -m json.tool dashboard/data/boston-models.json > /dev/null

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
